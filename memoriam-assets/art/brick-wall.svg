    <rect x="1" y="1" width="58" height="27" rx="1"/><rect x="61" y="1" width="58" height="27" rx="1"/>
    <rect x="-29" y="31" width="58" height="28" rx="1"/><rect x="31" y="31" width="58" height="28" rx="1"/><rect x="91" y="31" width="58" height="28" rx="1"/>
  </g>
  <g fill="#161414" opacity=".8"><rect x="61" y="1" width="58" height="27"/><rect x="-29" y="31" width="58" height="28"/><rect x="91" y="31" width="58" height="28"/></g>
  <rect width="120" height="60" fill="#fff" filter="url(#grit)"/>
